<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Dashboard Greenhouse · Lavaland Farmhouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --navy:#1f3864;--navy2:#172a4d;--blue:#4472C4;--blue-l:#e9effa;--org:#ED7D31;--org-l:#fdeee3;
  --bg:#f3f5f9;--card:#fff;--line:#e2e7ef;--line2:#eef1f6;--txt:#1b2333;--mut:#6b7486;--mut2:#98a0b0;
  --ok:#2e7d4f;--ok-l:#e6f3ec;--bad:#b42318;--bad-l:#fdecea;--warn:#8a5a00;--warn-l:#fff4d6;
  --r:10px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- kerangka ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--navy) 232px,var(--bg) 232px)}
.side{background:var(--navy);color:#cfd8ea;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .lg{width:34px;height:34px;border-radius:8px;background:var(--org);display:grid;place-items:center;color:#fff}
.brand .lg svg{width:20px;height:20px;fill:#fff}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand small{display:block;font-size:11.5px;color:#9fb0cf}
nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
nav .nl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#8193b5;padding:8px 12px 6px}
nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:9px 12px;color:#cfd8ea;font-size:14px}
nav button svg{width:18px;height:18px;fill:currentColor;opacity:.85;flex:none}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--org)}
nav button .cnt{margin-left:auto;font-size:11px;background:var(--org);color:#fff;border-radius:9px;padding:0 7px;line-height:18px}
.sfoot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#9fb0cf}
.sfoot b{display:block;color:#fff;font-size:13px;font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 36px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.ph h1{margin:0;font-size:22px;font-weight:650;color:var(--navy);letter-spacing:-.2px}
.ph p{margin:3px 0 0;color:var(--mut);font-size:13.5px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.content{padding:24px 36px 48px;max-width:1440px;width:100%}
.tab{display:none}.tab.on{display:block}

/* ---------- komponen ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:20px;min-width:0}
.phd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.phd h3{margin:0;font-size:15px;font-weight:650;color:var(--txt)}
.phd .muted{font-size:12.5px}
.pbd{padding:16px 18px}
.pbd.np{padding:0}
.muted{color:var(--mut)}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px}
.sech h2{margin:0;font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.7px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px;align-items:start}
.g2>.panel,.g3>.panel,.g21>.panel,.g12>.panel{margin-bottom:0}
.gap{height:20px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.kpi.o:before{background:var(--org)}.kpi.n:before{background:var(--navy)}.kpi.g:before{background:#9aa6bd}.kpi.k:before{background:var(--ok)}
.kpi .kl{font-size:12.5px;color:var(--mut);font-weight:500}
.kpi .kv{font-size:28px;font-weight:650;color:var(--navy);line-height:1.15;margin-top:6px;letter-spacing:-.4px}
.kpi .kv small{font-size:14px;font-weight:500;color:var(--mut);margin-left:3px}
.kpi .ks{font-size:12px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;line-height:18px;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.berjalan{background:var(--blue-l);color:var(--navy)}
.badge.selesai{background:#eef0f4;color:#5a6478}
.badge.rencana{background:var(--org-l);color:#b0510f}
.badge.late{background:var(--bad-l);color:var(--bad)}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.tag{display:inline-block;font-size:11.5px;border-radius:5px;padding:1px 7px;background:#f0f3f8;color:#465068;margin-right:4px;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:7px;padding:8px 15px;font-size:13.5px;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.sec{background:#fff;color:var(--txt);border-color:#cfd6e2}
.btn.sec:hover{background:#f6f8fb;filter:none}
.btn.del{background:#fff;color:var(--bad);border-color:#efc2bd}
.btn.del:hover{background:var(--bad-l);filter:none}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.blk{width:100%}
.lnk{background:none;border:0;color:var(--blue);font-weight:600;font-size:13px;padding:0}
.lnk:hover{text-decoration:underline}

.seg{display:inline-flex;background:#e9edf4;border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:6px;padding:6px 13px;font-size:13px;color:#4a5468;white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);background:#f7f9fc;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.tb td.w{white-space:normal}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr[data-ec]{cursor:pointer}
.tb tbody tr:hover td{background:#f8fafd}
.tb .r{text-align:right}.tb .c{text-align:center}
.tb .b{font-weight:600}
.tscroll{overflow-x:auto}

.dl{display:grid;grid-template-columns:150px 1fr;gap:9px 16px;font-size:13.5px;margin:0}
.dl dt{color:var(--mut)}.dl dd{margin:0;font-weight:500}
.kvl .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kvl .kv:last-child{border-bottom:0}
.kvl .kv span{color:var(--mut)}.kvl .kv b{font-weight:600;text-align:right}

.bar{height:8px;background:#e7ebf2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.o i{background:var(--org)}.bar.k i{background:var(--ok)}

.empty{color:var(--mut2);text-align:center;padding:28px 16px;font-size:13.5px}
.note{font-size:12.5px;color:var(--mut);padding:10px 18px 14px}

label.fl{display:block;font-size:12.5px;font-weight:600;color:#3a4458;margin:0 0 5px}
input,select,textarea{width:100%;font-size:14px;padding:8px 11px;border:1px solid #cfd6e2;border-radius:7px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(68,114,196,.15)}
textarea{resize:vertical}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.fg .full{grid-column:1/-1}

/* ---------- dialog ---------- */
#sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
#sheet.on{display:flex}
#sheet .dlg{background:#fff;border-radius:12px;width:min(760px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,23,42,.3)}
#sheet .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
#sheet .mh h3{margin:0;font-size:17px;color:var(--navy)}
#sheet .mh .x{border:0;background:none;font-size:22px;line-height:1;color:var(--mut);padding:2px 6px;border-radius:6px}
#sheet .mh .x:hover{background:#f0f3f8}
#sheet .mb{padding:20px 22px;overflow:auto}
#sheet .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:#fafbfd;border-radius:0 0 12px 12px}
#sheet .mf .sp{flex:1}
.mstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px}
.mstrip div{background:#f8fafd;padding:10px 14px}
.mstrip span{display:block;font-size:11.5px;color:var(--mut)}
.mstrip b{font-size:15px;color:var(--navy)}

.toast{position:fixed;right:28px;bottom:28px;background:#1b2333;color:#fff;padding:11px 16px;border-radius:8px;font-size:13.5px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:60;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:none}

/* ---------- layar kecil ---------- */
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--bg)}
  .seg{max-width:100%;overflow-x:auto}
  .side{position:sticky;height:auto;z-index:20}
  .brand{padding:12px 16px}
  nav{flex-direction:row;overflow-x:auto;padding:6px 8px}
  nav .nl{display:none}
  nav button{width:auto;flex:none}
  .sfoot{display:none}
  .ph{padding:18px 16px 14px;flex-direction:column;align-items:flex-start}
  .content{padding:16px}
  .g2,.g3{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr}
}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{width:2px;height:12px;background:var(--org);border-radius:0}
.ghc .pbd{padding:18px}
.cur{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.hst{font-size:40px;font-weight:700;color:var(--navy);line-height:1;letter-spacing:-1px;margin-top:6px}
.hst span{font-size:15px;font-weight:600;color:var(--mut);margin-left:6px;letter-spacing:0}
.pl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:7px}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-top:16px}
.met{background:#fff;padding:11px 13px}
.met span{display:block;font-size:11.5px;color:var(--mut)}
.met b{display:block;font-size:15.5px;color:var(--txt);margin-top:2px;white-space:nowrap}
.met em{display:block;font-style:normal;font-size:11.5px;color:var(--mut2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghf{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line2);background:#fafbfd;border-radius:0 0 var(--r) var(--r)}
.ghf>div{padding:12px 18px}
.ghf>div+div{border-left:1px solid var(--line2)}
.ghf span{display:block;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.ghf b{font-size:13.5px;color:var(--blue);cursor:pointer;margin-right:6px}
.ghf em{font-style:normal;font-size:12.5px;color:var(--mut)}
.tb tfoot td{border-top:1px solid var(--line);border-bottom:0;background:#f7f9fc}
.cz{display:grid;gap:9px}.czr{display:grid;grid-template-columns:minmax(0,320px) 1fr 54px 52px;gap:12px;align-items:center;font-size:13px}
.czr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.czr b{text-align:right}.czr em{font-style:normal;color:var(--mut);text-align:right;font-size:12px}
.tb.sticky thead th{position:sticky;top:0;z-index:1}.tb.sticky tfoot td{position:sticky;bottom:0}
.capc{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.capc .bar{width:56px;height:6px}
.g3 .mets{grid-template-columns:repeat(2,1fr)}
@media (max-width:1250px){.mets{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="lg"><svg viewBox="0 0 24 24"><path d="M12 3 2 10v11h20V10zm0 2.5 7 4.9V19h-3v-6H8v6H5v-8.6zM10 15h4v4h-4z"/></svg></div><div><b>Dashboard Greenhouse</b><small>Lavaland Farmhouse</small></div></div>
  <nav>
    <div class="nl">Menu</div>

    <button data-t="siklus"><svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3zm-1 8v10h12V10zm0-4v2h12V6z"/></svg>Siklus tanam</button>
    <button data-t="pop"><svg viewBox="0 0 24 24"><path d="M12 2C8 6 6 9.5 6 12.5a6 6 0 0 0 5 5.9V22h2v-3.6a6 6 0 0 0 5-5.9C18 9.5 16 6 12 2zm0 3.2c2.6 3 4 5.4 4 7.3a4 4 0 0 1-3 3.9V11h-2v5.4a4 4 0 0 1-3-3.9c0-1.9 1.4-4.3 4-7.3z"/></svg>Populasi</button>

    <button data-t="atur"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.7a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7 7 0 0 0 1.7 1L11 21h4l.4-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg>Pengaturan data</button>
  </nav>
  <div class="sfoot"><b id="sdate"></b>Data tersimpan di browser ini</div>
</aside>
<div class="main">
  <header class="ph"><div><h1 id="pt"></h1><p id="ps"></p></div><div class="acts" id="pa"></div></header>
  <main class="content">
    <section id="t-ring" class="tab on"></section>
    <section id="t-siklus" class="tab"></section>
    <section id="t-pop" class="tab"></section>
    <section id="t-gh" class="tab"></section>
    <section id="t-atur" class="tab"></section>
  </main>
</div>
</div>
<div id="sheet"><div class="dlg"><div class="mh"><h3 id="mt"></h3><button class="x" data-close="1" aria-label="Tutup">×</button></div><div class="mb" id="sin"></div><div class="mf" id="mf"></div></div></div>
<div class="toast" id="toast"></div>

function nowD(){return P.get("today")?new Date(P.get("today")+"T12:00:00"):new Date()}
function pad(n){return("0"+n).slice(-2)}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pd(s){return new Date(s+"T12:00:00")}
function add(s,n){return ymd(new Date(pd(s).getTime()+n*864e5))}
function diff(a,b){return Math.round((pd(a)-pd(b))/864e5)}
var BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function fd(s){if(!s)return"–";var d=pd(s);return d.getDate()+" "+BLN[d.getMonth()]+" "+d.getFullYear()}
function fs(s){if(!s)return"–";var d=pd(s);return d.getDate()+" "+BLN[d.getMonth()]}
function nf(v,d){if(v===""||v==null||isNaN(v))return"–";return Number(v).toLocaleString("id-ID",{maximumFractionDigits:d==null?0:d,minimumFractionDigits:d==null?0:d})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var $=function(i){return document.getElementById(i)};
function toast(t){var m=$("toast");m.textContent=t;m.classList.add("show");setTimeout(function(){m.classList.remove("show")},2000)}
function todayS(){return ymd(nowD())}

/* ============ STATE ============ */
var KEY="ghd.v1";
var D=(function(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.ghs&&d.cycles)return d}catch(e){}return JSON.parse(JSON.stringify(SEED))})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast("Gagal menyimpan")}}
function ghOf(id){return D.ghs.filter(function(g){return g.id===id})[0]}
function cyOf(id){return D.cycles.filter(function(c){return c.id===id})[0]}

/* ============ LOGIKA SIKLUS ============ */
var ECT=[[1,3,1.4,"Establishment"],[4,6,1.8,"Establishment"],[7,10,2.2,"Growth"],[11,14,2.6,"Growth"],[15,19,3.0,"Growth"],[20,43,3.4,"Fruit Set"],[44,58,3.0,"Fruit Fill"],[59,999,2.6,"Pematangan"]];
function ecAt(h){for(var i=0;i<ECT.length;i++)if(h>=ECT[i][0]&&h<=ECT[i][1])return ECT[i];return null}
function ecNext(h){for(var i=0;i<ECT.length;i++)if(ECT[i][0]>h)return ECT[i];return null}
function stat(c){if(c.status)return c.status;var td=todayS();if(c.panenSelesai&&c.panenSelesai<td)return"selesai";if(c.tanam&&c.tanam<=td)return"berjalan";return"rencana"}
var SLAB={berjalan:"Berjalan",selesai:"Selesai",rencana:"Akan datang"};
function endOf(c){return c.panenSelesai||(c.panenMulai?add(c.panenMulai,3):add(c.tanam,60))}
function endEst(c){return!c.panenSelesai}
function fmt1(v){return v.toFixed(1).replace(".",",")}
function cyclesOf(g){return D.cycles.filter(function(c){return c.gh===g}).sort(function(a,b){return(a.tanam||"9").localeCompare(b.tanam||"9")})}
function curOf(g){var r=cyclesOf(g).filter(function(c){return stat(c)==="berjalan"});return r[r.length-1]}
function nextOf(g){return cyclesOf(g).filter(function(c){return stat(c)==="rencana"})[0]}
function lastOf(g){var r=cyclesOf(g).filter(function(c){return stat(c)==="selesai"});return r[r.length-1]}
function metrics(c,g){var o=[];
  if(c.hasilKg!==""&&c.hasilKg!=null){o.push(["Hasil panen",nf(c.hasilKg,2)+" kg"]);if(g&&g.luas)o.push(["Produktivitas",nf(c.hasilKg/g.luas,2)+" kg/m²"]);
    if(c.targetKg)o.push(["Capaian vs target "+nf(c.targetKg)+" kg",nf(c.hasilKg/c.targetKg*100,1)+"%"]);
    if(c.buah)o.push(["Jumlah buah · rerata",nf(c.buah)+" · "+nf(c.hasilKg/c.buah,3)+" kg"])}
  return o}

/* ============ TAMPILAN ============ */
function badge(st,txt){return'<span class="badge '+st+'">'+(txt||SLAB[st])+'</span>'}
function kpi(l,v,s,c){return'<div class="kpi '+(c||"")+'"><div class="kl">'+l+'</div><div class="kv">'+v+'</div>'+(s?'<div class="ks" title="'+esc(s.replace(/<[^>]+>/g,""))+'">'+s+'</div>':'')+'</div>'}
function head(t,s,a){$("pt").textContent=t;$("ps").innerHTML=s;$("pa").innerHTML=a||""}
function hasKg(c){return c.hasilKg!==""&&c.hasilKg!=null}
function popOf(c){return c.popAkhir||c.popTanam||c.popTarget}
function panenOf(c){return c.panenMulai||(c.tanam?add(c.tanam,55):"")}
var IC={
 plus:'<svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>',
 dl:'<svg viewBox="0 0 24 24"><path d="M11 4h2v9l3.5-3.5 1.4 1.4L12 16.8l-5.9-5.9 1.4-1.4L11 13zM5 18h14v2H5z"/></svg>'};

/* ---------- Ringkasan ---------- */
function renderRing(){
  var td=todayS(),all=D.cycles,fin=all.filter(function(c){return stat(c)==="selesai"}),run=all.filter(function(c){return stat(c)==="berjalan"}),pl=all.filter(function(c){return stat(c)==="rencana"}).sort(function(a,b){return(a.tanam||"9").localeCompare(b.tanam||"9")});
  var kg=0,nkg=0,luas=0;fin.forEach(function(c){if(hasKg(c)){kg+=Number(c.hasilKg);nkg++}});D.ghs.forEach(function(g){luas+=Number(g.luas)||0});
  head("Ringkasan","Kondisi semua greenhouse per "+fd(td),'<button class="btn sec" data-nav="siklus">Lihat semua siklus</button><button class="btn" data-newc="'+D.ghs[0].id+'">'+IC.plus+'Tambah siklus</button>');
  var h='<div class="kpis">'+
    kpi("Greenhouse",D.ghs.length,nf(luas)+" m² luas tanam","n")+
    kpi("Siklus berjalan",run.length,run.map(function(c){var g=ghOf(c.gh);return(g?g.nama:c.gh)+" "+c.nama.replace("Siklus ","S")}).join(" · ")||"–","")+
    kpi("Siklus akan datang",pl.length,pl[0]?"Terdekat: tanam "+fd(pl[0].tanam):"–","o")+
    kpi("Siklus selesai",fin.length,nkg+" siklus memiliki data hasil","g")+
    kpi("Hasil panen tercatat",nf(kg,0)+"<small>kg</small>","Akumulasi siklus selesai","k")+'</div>';
  h+='<div class="sech"><h2>Status per greenhouse</h2></div><div class="g'+(D.ghs.length>=3?"3":"2")+'">'+D.ghs.map(ghCard).join("")+'</div><div class="gap"></div>';
  h+='<div class="panel"><div class="phd"><h3>Linimasa siklus</h3><div class="legend">'+
     '<span><i style="background:#c9d3ea"></i>Semai</span><span><i style="background:#1f3864"></i>Berjalan</span><span><i style="background:#9aa6bd"></i>Selesai</span><span><i style="background:#ED7D31"></i>Akan datang</span><span><i class="ln"></i>Hari ini</span></div></div>'+
     '<div class="pbd"><canvas id="cvg"></canvas></div><div class="note">Ujung batang bergaris putus-putus menandakan tanggal akhir masih estimasi (tanam + 60 hari, atau panen mulai + 3 hari).</div></div>';
  h+='<div class="panel"><div class="phd"><h3>Riwayat siklus selesai</h3><span class="muted">'+(nkg?"Total tercatat "+nf(kg,2)+" kg":"Belum ada data hasil")+'</span></div>'+
     (fin.length?cycTable(fin.sort(function(a,b){return(b.tanam||"").localeCompare(a.tanam||"")}),"fin"):'<div class="empty">Belum ada siklus selesai</div>')+'</div>';
  $("t-ring").innerHTML=h;drawGantt();
}
function met(l,v,s){return'<div class="met"><span>'+l+'</span><b>'+v+'</b>'+(s?'<em>'+s+'</em>':'')+'</div>'}
function ghCard(g){
  var c=curOf(g.id),nx=nextOf(g.id),ls=lastOf(g.id),td=todayS();
  var h='<div class="panel ghc"><div class="phd"><div><h3>'+esc(g.nama)+'</h3><div class="muted" style="font-size:12.5px">'+nf(g.luas)+' m² · '+esc(g.sistem||"–")+'</div></div><button class="lnk" data-eg="'+g.id+'">Profil</button></div><div class="pbd">';
  if(c){var hst=diff(td,c.tanam),e=ecAt(hst),en=ecNext(hst),pm=panenOf(c),span=diff(pm,c.tanam)||55,pr=Math.max(0,Math.min(100,hst/span*100)),sisa=diff(pm,td);
    h+='<div class="cur"><div><div class="muted" style="font-size:12.5px">'+esc(c.nama)+' · '+esc(c.var||"varietas –")+'</div><div class="hst">'+hst+'<span>HST</span></div></div><div style="text-align:right">'+badge("berjalan")+'<div class="muted" style="font-size:12.5px;margin-top:6px">Stadia <b style="color:var(--txt)">'+(e?e[3]:"–")+'</b></div></div></div>'+
      '<div class="bar"><i style="width:'+pr.toFixed(1)+'%"></i></div>'+
      '<div class="pl"><span>Tanam '+fs(c.tanam)+'</span><span>'+(sisa>=0?sisa+" hari menuju panen":"masa panen")+'</span><span>Panen '+(c.panenMulai?"":"est. ")+fs(pm)+'</span></div>'+
      '<div class="mets">'+met("Target EC",e?fmt1(e[2])+" dS/m":"–","hari ini")+met("EC berikutnya",en?fmt1(en[2])+" dS/m":"–",en?fs(add(c.tanam,en[0]))+" · "+en[0]+" HST":"")+met("Populasi",nf(popOf(c)),"tanaman")+met("Semai",fs(c.semai),c.semai?diff(c.tanam,c.semai)+" hari di nursery":"")+'</div>'+
      '<button class="btn sec blk" data-ec="'+c.id+'" style="margin-top:16px">Buka detail siklus</button>';
  }else h+='<div class="empty" style="padding:22px 0">Tidak ada siklus yang sedang berjalan</div>';
  h+='</div><div class="ghf">'+
    '<div><span>Berikutnya</span>'+(nx?'<b data-ec="'+nx.id+'">'+esc(nx.nama)+'</b><em>tanam '+fd(nx.tanam)+' · '+diff(nx.tanam,td)+' hari lagi</em>':'<em>Belum dijadwalkan</em>')+'</div>'+
    '<div><span>Terakhir selesai</span>'+(ls?'<b data-ec="'+ls.id+'">'+esc(ls.nama)+'</b><em>'+(hasKg(ls)?nf(ls.hasilKg,0)+" kg":"hasil belum diisi")+'</em>':'<em>–</em>')+'</div></div></div>';
  return h}

/* tabel siklus — mode "fin" (selesai) atau "all" */
function cycTable(list,mode){
  var td=todayS(),h='<div class="tscroll"><table class="tb"><thead><tr><th>Greenhouse</th><th>Siklus</th>'+(mode==="all"?'<th>Status</th>':'')+'<th>Varietas</th><th>Semai</th><th>Tanam</th>'+
   (mode==="all"?'<th>Umur / jadwal</th>':'<th>Panen</th><th class="r">Durasi</th>')+'<th class="r">Populasi</th><th class="r">Buah</th><th class="r">Hasil (kg)</th><th class="r">kg/m²</th><th class="r">Capaian</th></tr></thead><tbody>';
  list.forEach(function(c){var g=ghOf(c.gh),st=stat(c),info="–";
    if(st==="berjalan")info='<b>'+diff(td,c.tanam)+' HST</b> <span class="muted">· panen '+(c.panenMulai?"":"est. ")+fs(panenOf(c))+'</span>';
    else if(st==="rencana")info=c.tanam?'tanam dalam <b>'+diff(c.tanam,td)+' hari</b>':"–";
    else info=c.panenSelesai?'panen '+fs(c.panenMulai||c.panenSelesai)+'–'+fs(c.panenSelesai):'<span class="muted">tanggal panen –</span>';
    var cap=hasKg(c)&&c.targetKg?c.hasilKg/c.targetKg*100:null;
    h+='<tr data-ec="'+c.id+'"><td class="b">'+esc(g?g.nama:c.gh)+'</td><td>'+esc(c.nama)+'</td>'+(mode==="all"?'<td>'+badge(st)+'</td>':'')+
      '<td>'+esc(c.var||"–")+'</td><td>'+fs(c.semai)+'</td><td>'+fs(c.tanam)+'</td>'+
      (mode==="all"?'<td>'+info+'</td>':'<td>'+(c.panenSelesai?fs(c.panenMulai||c.panenSelesai)+' – '+fs(c.panenSelesai):'–')+'</td><td class="r">'+(c.panenSelesai&&c.tanam?diff(c.panenSelesai,c.tanam)+" hari":"–")+'</td>')+
      '<td class="r">'+nf(popOf(c))+'</td><td class="r">'+nf(c.buah)+'</td><td class="r b">'+(hasKg(c)?nf(c.hasilKg,2):"–")+'</td><td class="r">'+(hasKg(c)&&g&&g.luas?nf(c.hasilKg/g.luas,2):"–")+'</td>'+
      '<td class="r">'+(cap!=null?'<div class="capc"><span>'+nf(cap,1)+'%</span><div class="bar '+(cap>=90?"k":cap>=60?"":"o")+'"><i style="width:'+Math.min(100,cap)+'%"></i></div></div>':"–")+'</td></tr>'});
  return h+'</tbody></table></div>'}

function drawGantt(){
  var cv=$("cvg");if(!cv)return;var dpr=window.devicePixelRatio||1,W=cv.parentNode.clientWidth-36,RH=50,T=30,B=22,H=T+D.ghs.length*RH+B;
  cv.style.width=W+"px";cv.style.height=H+"px";cv.width=W*dpr;cv.height=H*dpr;var c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  var F='"Segoe UI",system-ui,Arial,sans-serif',td=todayS();
  var cs=D.cycles.filter(function(x){return x.tanam});if(!cs.length)return;
  var min=cs.reduce(function(m,x){var s=x.semai||x.tanam;return s<m?s:m},"9999-01-01"),max=cs.reduce(function(m,x){var e=endOf(x);return e>m?e:m},"0000-01-01");
  min=add(min,-8);max=add(max,10);var L=70,R=8,pw=W-L-R,span=diff(max,min),X=function(s){return L+diff(s,min)/span*pw};
  function rr(x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);c.fill()}
  c.font="12px "+F;c.textBaseline="middle";
  var d=pd(min);d=new Date(d.getFullYear(),d.getMonth()+1,1,12);
  while(ymd(d)<max){var x=X(ymd(d));c.strokeStyle="#e7ebf2";c.lineWidth=1;c.beginPath();c.moveTo(x+.5,T-8);c.lineTo(x+.5,H-B+4);c.stroke();
    c.fillStyle="#6b7486";c.textAlign="left";c.fillText(BLN[d.getMonth()]+(d.getMonth()===0?" "+d.getFullYear():""),x+5,T-16);d=new Date(d.getFullYear(),d.getMonth()+1,1,12)}
  D.ghs.forEach(function(g,gi){var y=T+gi*RH;
    if(gi%2===0){c.fillStyle="#f8fafd";c.fillRect(0,y,W,RH)}
    c.fillStyle="#1f3864";c.font="600 13px "+F;c.textAlign="left";c.fillText(g.nama,8,y+RH/2);c.font="12px "+F;
    cyclesOf(g.id).forEach(function(cy){if(!cy.tanam)return;var st=stat(cy),x1=X(cy.tanam),x2=X(endOf(cy));
      if(cy.semai){c.fillStyle="#c9d3ea";rr(X(cy.semai),y+15,Math.max(2,x1-X(cy.semai))+4,20,4)}
      c.fillStyle=st==="berjalan"?"#1f3864":st==="selesai"?"#9aa6bd":"#ED7D31";rr(x1,y+11,Math.max(5,x2-x1),28,5);
      if(endEst(cy)){c.setLineDash([3,3]);c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=2;c.beginPath();c.moveTo(x2-3,y+14);c.lineTo(x2-3,y+36);c.stroke();c.setLineDash([]);c.lineWidth=1}
      c.fillStyle="#fff";c.textAlign="left";c.font="600 12px "+F;var lab=cy.nama;if(c.measureText(lab).width>x2-x1-14)lab=cy.nama.replace("Siklus ","S");if(c.measureText(lab).width<x2-x1-10)c.fillText(lab,x1+7,y+RH/2);c.font="12px "+F})});
  var xt=X(td);c.strokeStyle="#ED7D31";c.lineWidth=2;c.beginPath();c.moveTo(xt,T-6);c.lineTo(xt,H-B+2);c.stroke();c.lineWidth=1;
  c.fillStyle="#ED7D31";c.font="600 11.5px "+F;c.textAlign="center";c.fillText("Hari ini · "+fs(td),Math.min(W-50,Math.max(50,xt)),H-9);
}
window.addEventListener("resize",function(){clearTimeout(window.__rz);window.__rz=setTimeout(drawGantt,120)});

/* ---------- Siklus ---------- */
var fG="",fS="";

  var l=D.cycles.filter(function(c){return(!fG||c.gh===fG)&&(!fS||stat(c)===fS)});
  var ord={berjalan:0,rencana:1,selesai:2};l.sort(function(a,b){return ord[stat(a)]-ord[stat(b)]||(stat(a)==="selesai"?(b.tanam||"").localeCompare(a.tanam||""):(a.tanam||"9").localeCompare(b.tanam||"9"))});
  var cnt=function(st){return D.cycles.filter(function(c){return(!fG||c.gh===fG)&&stat(c)===st}).length};

  var h='<div class="toolbar"><div class="seg">'+[["","Semua greenhouse"]].concat(D.ghs.map(function(g){return[g.id,g.nama]})).map(function(a){return'<button data-fg="'+a[0]+'" class="'+(fG===a[0]?"on":"")+'">'+esc(a[1])+'</button>'}).join("")+'</div>'+

  h+='<div class="panel">'+(l.length?cycTable(l,"all"):'<div class="empty">Tidak ada siklus untuk filter ini</div>')+'</div>';

/* ---------- Atur ---------- */

function dlg(t,body,foot){$("mt").innerHTML=t;$("sin").innerHTML=body;$("mf").innerHTML=foot;$("sheet").classList.add("on");$("sin").scrollTop=0}
function openCycle(id,gh){
  var c=id?cyOf(id):{gh:gh,nama:"Siklus "+(cyclesOf(gh).length+1),status:"",catatan:""},g=ghOf(c.gh),st=id?stat(c):"rencana",h='';
  if(id){var m=[],td=todayS();
    if(c.tanam){if(st==="berjalan"){var hs=diff(td,c.tanam),e=ecAt(hs);m.push(["Umur",hs+" HST"]);m.push(["Stadia",e?e[3]:"–"]);m.push(["Target EC",e?fmt1(e[2])+" dS/m":"–"]);m.push(["Panen",(c.panenMulai?"":"est. ")+fd(panenOf(c))])}
      else if(st==="rencana"){m.push(["Tanam",fd(c.tanam)]);m.push(["Hitung mundur",diff(c.tanam,td)+" hari"]);if(c.semai)m.push(["Semai",fd(c.semai)])}
      else if(c.panenSelesai)m.push(["Tanam → panen selesai",diff(c.panenSelesai,c.tanam)+" hari"])}
    metrics(c,g).forEach(function(r){m.push(r)});
    if(m.length)h+='<div class="mstrip">'+m.map(function(r){return'<div><span>'+r[0]+'</span><b>'+r[1]+'</b></div>'}).join("")+'</div>'}
  h+='<div class="fg"><div><label class="fl">Greenhouse</label><select data-f="gh">'+D.ghs.map(function(x){return'<option value="'+x.id+'"'+(x.id===c.gh?" selected":"")+'>'+esc(x.nama)+'</option>'}).join("")+'</select></div>'+
    '<div><label class="fl">Status</label><select data-f="status"><option value="">Otomatis dari tanggal</option><option value="rencana"'+(c.status==="rencana"?" selected":"")+'>Akan datang</option><option value="berjalan"'+(c.status==="berjalan"?" selected":"")+'>Berjalan</option><option value="selesai"'+(c.status==="selesai"?" selected":"")+'>Selesai</option></select></div>'+
    formHTML(CF,c)+'<div class="full"><label class="fl">Catatan</label><textarea rows="4" data-f="catatan">'+esc(c.catatan)+'</textarea></div></div>';
  dlg((id?esc(g.nama)+' · '+esc(c.nama)+' '+badge(st):'Tambah siklus'),h,
    (id?'<button class="btn del" data-delc="'+id+'">Hapus</button>':'')+'<div class="sp"></div><button class="btn sec" data-close="1">Batal</button><button class="btn" data-savec="'+(id||"")+'">Simpan</button>')}

    var show=!i||i===l.length-1||(dv/rng>.12&&px-lastX>46&&X(hs[l.length-1])-px>46);
    if(show){x.font="600 11.5px "+F;x.textBaseline="alphabetic";x.textAlign=!i?"left":i===l.length-1?"right":"center";x.fillText(nf(p.jml),!i?px+7:i===l.length-1?px-2:px,py-10);x.font="11.5px "+F;lastX=px}});
}

function openPop(pid){
  var p=pid?(D.pops.filter(function(z){return z.id===pid})[0]):{cy:pC,tgl:todayS(),jml:"",mati:"",sulam:"",ket:""},c=cyOf(p.cy),lp=lastPop(c);
  var opts=D.ghs.map(function(g){return popCycles(g.id).map(function(x){return'<option value="'+x.id+'"'+(x.id===p.cy?" selected":"")+'>'+esc(g.nama)+' · '+esc(x.nama)+'</option>'}).join("")}).join("");
  var b='<div class="fg"><div class="full"><label class="fl">Siklus</label><select data-pf="cy">'+opts+'</select></div>'+
   '<div><label class="fl">Tanggal pencatatan</label><input type="date" data-pf="tgl" value="'+esc(p.tgl)+'"></div>'+
   '<div><label class="fl">Populasi tercatat (tanaman)</label><input type="number" inputmode="numeric" data-pf="jml" value="'+esc(p.jml)+'" placeholder="'+(lp&&!pid?"terakhir: "+lp.jml:"")+'"></div>'+
   '<div><label class="fl">Tanaman mati / dicabut sejak catatan sebelumnya</label><input type="number" inputmode="numeric" data-pf="mati" value="'+esc(p.mati)+'"></div>'+
   '<div><label class="fl">Tanaman disulam</label><input type="number" inputmode="numeric" data-pf="sulam" value="'+esc(p.sulam)+'"></div>'+
   '<div class="full"><label class="fl">Keterangan</label><textarea rows="3" data-pf="ket" placeholder="mis. sensus mingguan, penyebab kematian, lajur terdampak">'+esc(p.ket)+'</textarea></div></div>'+
   '<p class="muted" style="margin:12px 0 0">Bila kolom populasi dikosongkan, populasi dihitung otomatis dari catatan terakhir − mati + sulam.</p>';
  dlg(pid?"Ubah catatan populasi":"Catat populasi",b,(pid?'<button class="btn del" data-delp="'+pid+'">Hapus</button>':'')+'<div class="sp"></div><button class="btn sec" data-close="1">Batal</button><button class="btn" data-savep="'+(pid||"")+'">Simpan</button>')}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-pg],[data-pc],[data-newp],[data-ep],[data-savep],[data-delp]");
  if(e.target.closest("#pcsv")){var r=[["Greenhouse","Siklus","Tanggal","HST","Populasi","Mati/dicabut","Sulam","Keterangan"]];
    D.ghs.forEach(function(g){cyclesOf(g.id).forEach(function(c){popsOf(c.id).forEach(function(p){r.push([g.nama,c.nama,p.tgl,c.tanam?diff(p.tgl,c.tanam):"",p.jml,p.mati,p.sulam,p.ket])})})});
    dl("riwayat_populasi_"+todayS()+".csv","﻿"+r.map(function(x){return x.map(function(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n"),"text/csv");return}
  if(!el)return;var ds=el.dataset;

  if(ds.pc){pC=ds.pc;renderPop();return}

  if(ds.savep!==undefined){var g=function(k){return document.querySelector('#sin [data-pf="'+k+'"]').value.trim()},n=function(k){var v=g(k);return v===""?"":Number(v.replace(",","."))};
    var o=ds.savep?D.pops.filter(function(z){return z.id===ds.savep})[0]:{id:"p"+Date.now()};
    var om=o.mati;o.cy=g("cy");o.tgl=g("tgl");o.mati=n("mati");if(o.sebab&&om!==o.mati)delete o.sebab;o.sulam=n("sulam");o.ket=g("ket");o.jml=n("jml");
    if(!o.tgl){toast("Isi tanggal");return}
    if(o.jml===""){var prev=popsOf(o.cy).filter(function(z){return z.id!==o.id&&z.tgl<=o.tgl}).pop(),base=prev?prev.jml:firstPopV(cyOf(o.cy));
      if(base===""||base==null){toast("Isi populasi tercatat");return}o.jml=Number(base)-(Number(o.mati)||0)+(Number(o.sulam)||0)}
    if(!ds.savep)D.pops.push(o);var cc=cyOf(o.cy);pC=o.cy;pG=cc.gh;save();$("sheet").classList.remove("on");renderAll();toast("Catatan populasi tersimpan");return}
  if(ds.delp){if(confirm("Hapus catatan populasi ini?")){D.pops=D.pops.filter(function(z){return z.id!==ds.delp});save();$("sheet").classList.remove("on");renderAll()}return}
});

    if(!c.nama){toast("Isi nama siklus");return}if(!ds.savec)D.cycles.push(c);save();$("sheet").classList.remove("on");renderAll();toast("Tersimpan");return}
  if(ds.delc){if(confirm("Hapus siklus ini?")){D.cycles=D.cycles.filter(function(x){return x.id!==ds.delc});save();$("sheet").classList.remove("on");renderAll()}return}

  if(ds.delg){var n=D.cycles.filter(function(x){return x.gh===ds.delg}).length;if(confirm("Hapus greenhouse ini"+(n?" beserta "+n+" siklusnya":"")+"?")){D.ghs=D.ghs.filter(function(x){return x.id!==ds.delg});D.cycles=D.cycles.filter(function(x){return x.gh!==ds.delg});save();$("sheet").classList.remove("on");renderAll()}return}
});
